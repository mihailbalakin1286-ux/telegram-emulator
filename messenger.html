<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e1621;
            color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        /* AUTH SCREENS */
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #17212b 0%, #0e1621 100%);
        }
        .auth-box {
            background: #17212b;
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo svg { width: 60px; height: 60px; fill: #2b5278; }
        .auth-title { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .auth-subtitle { text-align: center; color: #7b8b9a; font-size: 14px; margin-bottom: 28px; }
        .auth-field {
            margin-bottom: 16px;
        }
        .auth-field input {
            width: 100%;
            padding: 12px 16px;
            background: #242f3d;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #f5f5f5;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-field input:focus { border-color: #2b5278; }
        .auth-field input::placeholder { color: #7b8b9a; }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #2b5278;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #3a6a94; }
        .auth-btn:active { transform: scale(0.98); }
        .auth-error {
            color: #e53935;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: #7b8b9a;
            font-size: 14px;
        }
        .auth-switch a {
            color: #2b5278;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        .auth-switch a:hover { text-decoration: underline; }

        /* MESSENGER LAYOUT */
        .messenger {
            display: flex;
            height: 100vh;
            display: none;
        }
        .messenger.active { display: flex; }

        /* SIDEBAR */
        .sidebar {
            width: 380px;
            background: #17212b;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #17212b;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            min-height: 56px;
        }
        .sidebar-header .hamburger {
            width: 40px; height: 40px;
            background: none; border: none;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .sidebar-header .hamburger:active { background: rgba(255,255,255,0.08); }
        .sidebar-header .hamburger svg { width: 24px; height: 24px; fill: #7b8b9a; }
        .sidebar-search {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #242f3d;
            margin: 8px 12px;
            border-radius: 20px;
        }
        .sidebar-search svg { width: 18px; height: 18px; fill: #7b8b9a; flex-shrink: 0; }
        .sidebar-search input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #f5f5f5;
            font-size: 14px;
        }
        .sidebar-search input::placeholder { color: #7b8b9a; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .chat-item:hover { background: rgba(255,255,255,0.03); }
        .chat-item.active { background: #2b5278; }
        .chat-item:active { background: rgba(255,255,255,0.05); }
        .chat-avatar {
            width: 54px; height: 54px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; font-weight: 500;
            flex-shrink: 0;
        }
        .chat-info { flex: 1; min-width: 0; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 9px; }
        .chat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .chat-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { color: #7b8b9a; font-size: 12px; flex-shrink: 0; margin-left: 8px; }
        .chat-time.unread { color: #2b5278; }
        .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
        .chat-last { color: #7b8b9a; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .chat-last .you { color: #f5f5f5; }
        .unread-badge {
            background: #2b5278; color: white;
            font-size: 12px; font-weight: 500;
            min-width: 22px; height: 22px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            padding: 0 6px; flex-shrink: 0; margin-left: 8px;
        }
        .online-dot {
            width: 14px; height: 14px;
            background: #4caf50;
            border: 2px solid #17212b;
            border-radius: 50%;
            position: absolute;
            bottom: 0; right: 0;
        }
        .chat-avatar-wrap { position: relative; flex-shrink: 0; }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0e1621;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .chat-area.empty {
            align-items: center;
            justify-content: center;
        }
        .empty-state {
            text-align: center;
            color: #7b8b9a;
        }
        .empty-state svg { width: 80px; height: 80px; fill: #2b5278; margin-bottom: 16px; }
        .empty-state h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; color: #f5f5f5; }
        .empty-state p { font-size: 14px; }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #17212b;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            min-height: 56px;
        }
        .chat-header .back-btn {
            display: none;
            width: 40px; height: 40px;
            background: none; border: none; border-radius: 50%;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .chat-header .back-btn svg { width: 24px; height: 24px; fill: #7b8b9a; }
        .chat-header-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; font-weight: 500;
            flex-shrink: 0;
        }
        .chat-header-info { flex: 1; }
        .chat-header-name { font-size: 15px; font-weight: 600; }
        .chat-header-status { font-size: 13px; }
        .chat-header-status.online { color: #2b5278; }
        .chat-header-status.offline { color: #7b8b9a; }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .date-separator {
            text-align: center;
            margin: 8px 0;
        }
        .date-label {
            display: inline-block;
            background: rgba(0,0,0,0.35);
            color: #b0c4d8;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 6px 10px 5px;
            border-radius: 12px;
            position: relative;
            line-height: 1.35;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .msg.me {
            align-self: flex-end;
            background: #2b5278;
            border-bottom-right-radius: 4px;
            margin-right: 4px;
        }
        .msg.them {
            align-self: flex-start;
            background: #182533;
            border-bottom-left-radius: 4px;
            margin-left: 4px;
        }
        .msg.me::after {
            content: '';
            position: absolute;
            right: -6px; bottom: 0;
            border-left: 6px solid #2b5278;
            border-bottom: 6px solid transparent;
        }
        .msg.them::after {
            content: '';
            position: absolute;
            left: -6px; bottom: 0;
            border-right: 6px solid #182533;
            border-bottom: 6px solid transparent;
        }
        .msg-text {
            font-size: 14.5px;
            line-height: 1.35;
            word-wrap: break-word;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            float: right;
            margin-left: 8px;
            position: relative;
            top: 5px;
        }
        .msg-time {
            font-size: 11px;
        }
        .msg.me .msg-time { color: rgba(255,255,255,0.55); }
        .msg.them .msg-time { color: rgba(255,255,255,0.45); }
        .msg-check { display: inline-flex; margin-left: 2px; }
        .msg-check svg { width: 16px; height: 11px; }
        .msg-check.read svg { fill: #5fb6f5; }
        .msg-check.sent svg { fill: rgba(255,255,255,0.45); }

        /* TYPING */
        .typing-indicator {
            align-self: flex-start;
            background: #182533;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            margin-left: 4px;
            display: none;
        }
        .typing-indicator.active { display: block; }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots .dot {
            width: 7px; height: 7px;
            background: #7b8b9a;
            border-radius: 50%;
            animation: dot 1.4s infinite ease-in-out;
        }
        .typing-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot { 0%,60%,100% { opacity:0.3; transform:scale(0.85); } 30% { opacity:1; transform:scale(1.1); } }

        /* INPUT */
        .input-bar {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 6px 8px;
            background: #17212b;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .input-wrap {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: #242f3d;
            border-radius: 20px;
            padding: 0 12px;
            min-height: 40px;
        }
        .input-wrap input {
            flex: 1;
            background: none; border: none;
            color: #f5f5f5; font-size: 15px;
            outline: none; padding: 9px 0;
        }
        .input-wrap input::placeholder { color: #7b8b9a; }
        .send-btn {
            width: 40px; height: 40px;
            background: none; border: none; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .send-btn svg { width: 24px; height: 24px; fill: #7b8b9a; transition: fill 0.2s; }
        .send-btn.active svg { fill: #2b5278; }
        .send-btn:active { transform: scale(0.9); }

        /* NEW CHAT MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #17212b;
            border-radius: 12px;
            width: 360px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .modal-header h3 { flex: 1; font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 32px; height: 32px;
            background: none; border: none; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .modal-close svg { width: 20px; height: 20px; fill: #7b8b9a; }
        .modal-close:active { background: rgba(255,255,255,0.08); }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .user-item:hover { background: rgba(255,255,255,0.03); }
        .user-item:active { background: rgba(255,255,255,0.05); }
        .user-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px; font-weight: 500;
        }
        .user-info { flex: 1; }
        .user-name { font-size: 15px; font-weight: 500; }
        .user-status { font-size: 13px; color: #7b8b9a; }
        .user-status.is-online { color: #2b5278; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .chat-area { display: none; }
            .chat-area.active { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; }
            .chat-header .back-btn { display: flex; }
        }
    </style>
</head>
<body>

<!-- AUTH: LOGIN -->
<div class="auth-screen" id="auth-login">
    <div class="auth-box">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
        </div>
        <div class="auth-title">Вход в Telegram</div>
        <div class="auth-subtitle">Введите ваши данные для входа</div>
        <div class="auth-field"><input type="text" id="login-username" placeholder="Имя пользователя" autocomplete="username"></div>
        <div class="auth-field"><input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password"></div>
        <button class="auth-btn" id="login-btn">Войти</button>
        <div class="auth-error" id="login-error"></div>
        <div class="auth-switch">Нет аккаунта? <a id="goto-register">Зарегистрироваться</a></div>
    </div>
</div>

<!-- AUTH: REGISTER -->
<div class="auth-screen" id="auth-register" style="display:none">
    <div class="auth-box">
        <div class="auth-logo">
            <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
        </div>
        <div class="auth-title">Регистрация</div>
        <div class="auth-subtitle">Создайте аккаунт для общения</div>
        <div class="auth-field"><input type="text" id="reg-display" placeholder="Ваше имя"></div>
        <div class="auth-field"><input type="text" id="reg-username" placeholder="Имя пользователя (логин)" autocomplete="username"></div>
        <div class="auth-field"><input type="password" id="reg-password" placeholder="Пароль" autocomplete="new-password"></div>
        <button class="auth-btn" id="reg-btn">Зарегистрироваться</button>
        <div class="auth-error" id="reg-error"></div>
        <div class="auth-switch">Уже есть аккаунт? <a id="goto-login">Войти</a></div>
    </div>
</div>

<!-- MESSENGER -->
<div class="messenger" id="messenger">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="hamburger" id="new-chat-btn">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <div style="flex:1;font-size:18px;font-weight:600">Telegram</div>
        </div>
        <div class="sidebar-search">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" placeholder="Поиск" id="sidebar-search-input">
        </div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-area empty" id="chat-area">
        <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
            <h2>Выберите чат</h2>
            <p>или начните новый разговор</p>
        </div>

        <div id="chat-view" style="display:none;flex-direction:column;height:100%">
            <div class="chat-header">
                <button class="back-btn" id="back-btn">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <div class="chat-avatar" id="chat-avatar"></div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-name"></div>
                    <div class="chat-header-status" id="chat-status"></div>
                </div>
            </div>
            <div class="messages-area" id="messages-area"></div>
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>
            <div class="input-bar">
                <div class="input-wrap">
                    <input type="text" id="msg-input" placeholder="Сообщение" autocomplete="off">
                </div>
                <button class="send-btn" id="send-btn">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="new-chat-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>Новый чат</h3>
            <button class="modal-close" id="modal-close"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        </div>
        <div class="modal-body" id="users-list"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const App = {
    me: null,
    socket: null,
    currentChat: null,
    conversations: {},
    typingTimeout: null,

    async init() {
        try {
            const res = await fetch('/api/me');
            if (res.ok) {
                this.me = await res.json();
                this.showMessenger();
            }
        } catch (e) {}

        document.getElementById('goto-register').onclick = () => {
            document.getElementById('auth-login').style.display = 'none';
            document.getElementById('auth-register').style.display = '';
        };
        document.getElementById('goto-login').onclick = () => {
            document.getElementById('auth-register').style.display = 'none';
            document.getElementById('auth-login').style.display = '';
        };

        document.getElementById('login-btn').onclick = () => this.login();
        document.getElementById('login-password').onkeydown = (e) => { if (e.key === 'Enter') this.login(); };
        document.getElementById('reg-btn').onclick = () => this.register();
        document.getElementById('reg-password').onkeydown = (e) => { if (e.key === 'Enter') this.register(); };

        document.getElementById('new-chat-btn').onclick = () => this.showNewChatModal();
        document.getElementById('modal-close').onclick = () => {
            document.getElementById('new-chat-modal').classList.remove('active');
        };
        document.getElementById('new-chat-modal').onclick = (e) => {
            if (e.target === e.currentTarget) e.target.classList.remove('active');
        };

        document.getElementById('send-btn').onclick = () => this.sendMessage();
        document.getElementById('msg-input').onkeydown = (e) => { if (e.key === 'Enter') this.sendMessage(); };
        document.getElementById('msg-input').oninput = () => {
            const active = document.getElementById('msg-input').value.trim().length > 0;
            document.getElementById('send-btn').classList.toggle('active', active);
            if (this.socket && this.currentChat) {
                this.socket.emit('typing', { to_id: this.currentChat.id, typing: active });
            }
        };

        document.getElementById('sidebar-search-input').oninput = (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(el => {
                el.style.display = el.dataset.name.toLowerCase().includes(q) ? '' : 'none';
            });
        };

        document.getElementById('back-btn').onclick = () => {
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('empty-state').style.display = '';
            document.getElementById('chat-area').classList.add('empty');
            this.currentChat = null;
        };
    },

    async login() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        errEl.textContent = '';

        if (!username || !password) { errEl.textContent = 'Заполните все поля'; return; }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) { errEl.textContent = data.error; return; }
            this.me = data;
            this.showMessenger();
        } catch (e) {
            errEl.textContent = 'Ошибка сети';
        }
    },

    async register() {
        const display_name = document.getElementById('reg-display').value.trim();
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        const errEl = document.getElementById('reg-error');
        errEl.textContent = '';

        if (!display_name || !username || !password) { errEl.textContent = 'Заполните все поля'; return; }

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, display_name })
            });
            const data = await res.json();
            if (!res.ok) { errEl.textContent = data.error; return; }
            this.me = data;
            this.showMessenger();
        } catch (e) {
            errEl.textContent = 'Ошибка сети';
        }
    },

    showMessenger() {
        document.getElementById('auth-login').style.display = 'none';
        document.getElementById('auth-register').style.display = 'none';
        document.getElementById('messenger').classList.add('active');

        this.socket = io();
        this.socket.emit('auth', this.me.id);

        this.socket.on('new-message', (msg) => this.onNewMessage(msg));
        this.socket.on('typing', (data) => this.onTyping(data));
        this.socket.on('messages-read', (data) => this.onMessagesRead(data));
        this.socket.on('user-online', (data) => this.onUserOnline(data));

        this.loadConversations();
    },

    async loadConversations() {
        const res = await fetch('/api/conversations');
        const convs = await res.json();
        const list = document.getElementById('chat-list');
        list.innerHTML = '';

        convs.sort((a, b) => {
            const da = new Date(a.last_date + ' ' + a.last_time);
            const db = new Date(b.last_date + ' ' + b.last_time);
            return db - da;
        });

        convs.forEach(c => {
            const el = document.createElement('div');
            el.className = 'chat-item';
            el.dataset.userid = c.user.id;
            el.dataset.name = c.user.display_name;
            const onlineClass = c.user.online ? ' style="display:block"' : ' style="display:none"';
            el.innerHTML = `
                <div class="chat-avatar-wrap">
                    <div class="chat-avatar" style="background:${c.user.avatar_color}">${c.user.display_name[0]}</div>
                    <div class="online-dot"${onlineClass}></div>
                </div>
                <div class="chat-info">
                    <div class="chat-top">
                        <span class="chat-name">${c.user.display_name}</span>
                        <span class="chat-time${c.unread > 0 ? ' unread' : ''}">${c.last_time}</span>
                    </div>
                    <div class="chat-bottom">
                        <span class="chat-last"><span class="you">Вы: </span>${c.last_message}</span>
                        ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
                    </div>
                </div>
            `;
            el.onclick = () => this.openChat(c.user);
            list.appendChild(el);
        });
    },

    async openChat(user) {
        this.currentChat = user;

        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        const existing = document.querySelector(`.chat-item[data-userid="${user.id}"]`);
        if (existing) existing.classList.add('active');

        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('chat-area').classList.remove('empty');

        document.getElementById('chat-avatar').style.background = user.avatar_color;
        document.getElementById('chat-avatar').textContent = user.display_name[0];
        document.getElementById('chat-name').textContent = user.display_name;
        const statusEl = document.getElementById('chat-status');
        statusEl.textContent = user.online ? 'в сети' : 'был(а) недавно';
        statusEl.className = 'chat-header-status ' + (user.online ? 'online' : 'offline');

        const res = await fetch(`/api/messages/${user.id}`);
        const msgs = await res.json();

        this.renderMessages(msgs);
        this.conversations[user.id] = msgs;

        this.socket.emit('mark-read', { from_id: user.id });

        document.getElementById('msg-input').focus();
    },

    renderMessages(msgs) {
        const area = document.getElementById('messages-area');
        area.innerHTML = '';
        let lastDate = '';

        msgs.forEach(m => {
            if (m.date !== lastDate) {
                lastDate = m.date;
                const sep = document.createElement('div');
                sep.className = 'date-separator';
                sep.innerHTML = `<span class="date-label">${m.date}</span>`;
                area.appendChild(sep);
            }

            const isMe = m.from_id === this.me.id;
            const el = document.createElement('div');
            el.className = 'msg ' + (isMe ? 'me' : 'them');

            let check = '';
            if (isMe) {
                if (m.status === 'read') {
                    check = '<span class="msg-check read"><svg viewBox="0 0 16 11"><path d="M11.07 0.73l-7.07 7.07-3.07-3.07L0 5.66l4 4 8-8z" fill="currentColor"/><path d="M16 0.73l-7.07 7.07-1.46-1.46L14.54 0.27 16 1.73z" fill="currentColor" opacity="0.7"/></svg></span>';
                } else {
                    check = '<span class="msg-check sent"><svg viewBox="0 0 16 11"><path d="M11.07 0.73l-7.07 7.07-3.07-3.07L0 5.66l4 4 8-8z" fill="currentColor"/></svg></span>';
                }
            }

            el.innerHTML = `<div class="msg-text">${this.escapeHtml(m.text)}</div><div class="msg-meta"><span class="msg-time">${m.time}</span>${check}</div>`;
            area.appendChild(el);
        });

        area.scrollTop = area.scrollHeight;
    },

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },

    sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !this.currentChat) return;

        this.socket.emit('send-message', { to_id: this.currentChat.id, text });
        input.value = '';
        document.getElementById('send-btn').classList.remove('active');
        this.socket.emit('typing', { to_id: this.currentChat.id, typing: false });
    },

    onNewMessage(msg) {
        const otherId = msg.from_id === this.me.id ? msg.to_id : msg.from_id;

        if (!this.conversations[otherId]) this.conversations[otherId] = [];
        this.conversations[otherId].push(msg);

        if (this.currentChat && otherId === this.currentChat.id) {
            this.renderMessages(this.conversations[otherId]);
            if (msg.from_id !== this.me.id) {
                this.socket.emit('mark-read', { from_id: otherId });
            }
        }

        this.loadConversations();
    },

    onTyping(data) {
        if (this.currentChat && data.from_id === this.currentChat.id) {
            const el = document.getElementById('typing-indicator');
            el.classList.toggle('active', data.typing);
            if (data.typing) {
                const area = document.getElementById('messages-area');
                area.scrollTop = area.scrollHeight;
            }
        }
    },

    onMessagesRead(data) {
        if (this.conversations[data.by_id]) {
            this.conversations[data.by_id].forEach(m => {
                if (m.from_id === this.me.id) m.status = 'read';
            });
            if (this.currentChat && data.by_id === this.currentChat.id) {
                this.renderMessages(this.conversations[data.by_id]);
            }
        }
    },

    onUserOnline(data) {
        const el = document.querySelector(`.chat-item[data-userid="${data.userId}"] .online-dot`);
        if (el) el.style.display = data.online ? 'block' : 'none';

        if (this.currentChat && data.userId === this.currentChat.id) {
            this.currentChat.online = data.online;
            const statusEl = document.getElementById('chat-status');
            statusEl.textContent = data.online ? 'в сети' : 'был(а) недавно';
            statusEl.className = 'chat-header-status ' + (data.online ? 'online' : 'offline');
        }
    },

    async showNewChatModal() {
        const res = await fetch('/api/users');
        const users = await res.json();
        const list = document.getElementById('users-list');
        list.innerHTML = '';

        if (users.length === 0) {
            list.innerHTML = '<div style="padding:20px;text-align:center;color:#7b8b9a">Пока нет других пользователей. Зарегистрируйте второй аккаунт в другой вкладке!</div>';
        }

        users.forEach(u => {
            const el = document.createElement('div');
            el.className = 'user-item';
            el.innerHTML = `
                <div class="user-avatar" style="background:${u.avatar_color}">${u.display_name[0]}</div>
                <div class="user-info">
                    <div class="user-name">${u.display_name}</div>
                    <div class="user-status${u.online ? ' is-online' : ''}">${u.online ? 'в сети' : 'был(а) недавно'}</div>
                </div>
            `;
            el.onclick = () => {
                document.getElementById('new-chat-modal').classList.remove('active');
                this.openChat(u);
            };
            list.appendChild(el);
        });

        document.getElementById('new-chat-modal').classList.add('active');
    }
};

App.init();
</script>
</body>
</html>
